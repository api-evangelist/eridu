anomalies:
- surface: /wp/v2/media
  observed: 'X-WP-Total reports 115 attachments, but an anonymous caller never receives more than 21 items
    no matter how it pages: per_page=10 returns 2 items, per_page=50 returns 12, per_page=100 returns
    21, each with X-WP-Total: 115. Requesting page=2 at per_page=2 returns an empty array.'
  cause: WordPress computes X-WP-Total before applying the per-attachment read filter, then removes attachments
    whose parent post is not publicly readable. The header therefore describes the library, while the
    body describes what the caller may see.
  impact: 'Agent-hostile: a client that trusts X-WP-Total to drive its paging loop will request pages
    that are permanently empty and conclude the API is failing. Page until the body is short, not until
    the header total is reached.'
  verified: '2026-08-12'
