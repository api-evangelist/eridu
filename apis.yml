aid: eridu
name: Eridu
description: >-
  Eridu is an AI networking infrastructure company founded in 2024 and headquartered at 12900
  Saratoga Ave in Saratoga, California. It is building a clean-sheet network switch architecture —
  silicon, systems and software together — aimed at the interconnect bottleneck that limits how
  efficiently GPUs exchange data inside large AI training clusters and data centers. The company was
  co-founded by CEO Drew Perkins, who previously co-founded Lightera Networks (acquired by Ciena) and
  Infinera, alongside Chief Product Officer Omar Hassen, and emerged from stealth in March 2026 with
  an oversubscribed Series A of more than $200M led by Socratic Partners, bringing total funding to
  approximately $230M with participation from John Doerr, Kleiner Perkins, Hudson River Trading,
  Capricorn Investment Group, Matter Venture Partners and Fusion Fund. Eridu is a semiconductor and
  systems company rather than a software vendor: it publishes no developer program, no developer
  portal, no product API, no SDKs and no pricing. The only machine-readable interface it serves is the
  WordPress core REST API behind its corporate site at eridu.ai, captured here for discovery purposes
  and anonymously readable but effectively read-only.
